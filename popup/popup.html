<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lean Lens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-branding">
        <img src="../icons/icon32.png" alt="Lean Lens logo" class="header-logo">
        <div>
          <h1 class="header-title">Lean Lens</h1>
          <span class="header-subtitle">Lean 4 Code Intelligence</span>
        </div>
      </div>
      <a href="../options/options.html" target="_blank" class="settings-btn" title="Open Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </a>
    </header>

    <!-- Master Switch -->
    <div class="toggle-card">
      <div class="toggle-info">
        <span class="toggle-label">Hover Definition Inspector</span>
        <span class="toggle-desc" id="toggle-desc">Active on GitHub PRs and files</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="extension-toggle" checked>
        <span class="slider round"></span>
      </label>
    </div>

    <!-- Page Status Card -->
    <div class="status-card" id="status-card">
      <div class="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Scanning current page...</span>
      </div>
      <div class="pr-decls-list-container hidden" id="pr-decls-box">
        <div class="pr-decls-header">
          <span>PR Local Definitions:</span>
          <span class="pr-decls-count" id="pr-decls-count">0</span>
        </div>
        <div class="pr-decls-tags" id="pr-decls-tags"></div>
      </div>
    </div>

    <!-- Quick Symbol Search -->
    <div class="search-section">
      <label class="section-label" for="symbol-search-input">Instant Symbol Lookup</label>
      <div class="search-input-group">
        <input type="text" id="symbol-search-input" placeholder="e.g. Continuous, simp, Finset.sum..." autocomplete="off">
        <button id="symbol-search-btn" class="search-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </div>
      <div class="search-result-box hidden" id="search-result-box">
        <div class="result-header">
          <span class="result-kind" id="result-kind">def</span>
          <span class="result-name" id="result-name"></span>
        </div>
        <pre class="result-signature" id="result-signature"></pre>
        <div class="result-docstring" id="result-docstring"></div>
      </div>
    </div>

    <!-- Footer Links -->
    <footer class="popup-footer">
      <a href="https://leanprover-community.github.io/mathlib4_docs/" target="_blank" rel="noreferrer" class="footer-link">Mathlib 4 Docs</a>
      <span class="footer-divider">•</span>
      <a href="https://loogle.lean-lang.org/" target="_blank" rel="noreferrer" class="footer-link">Loogle Search</a>
      <span class="footer-divider">•</span>
      <a href="https://loogle.lean-lang.org/" target="_blank" rel="noreferrer" class="footer-link">Loogle</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
